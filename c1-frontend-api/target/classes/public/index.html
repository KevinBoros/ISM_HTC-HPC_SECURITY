<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C1 Upload Test</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <section class="form-pane" id="formPane" style="display:none">
        <h1>Upload BMP Image</h1>

        <form id="uploadForm">
            <div>
                <label for="picture">BMP picture:</label>
                <input type="file" id="picture" name="picture" accept=".bmp" required>
            </div>

            <div>
                <label for="aesKey">AES key:</label>
                <input type="text" id="aesKey" name="aesKey" required>
            </div>

            <div>
                <label for="operation">Operation:</label>
                <select id="operation" name="operation">
                    <option value="encrypt">Encrypt</option>
                    <option value="decrypt">Decrypt</option>
                </select>
            </div>

            <button type="submit">Send to server</button>
        </form>

        <hr>

        <button id="healthBtn">Check backend health</button>

        <h2>Server response</h2>
        <pre id="output"></pre>

    </section>

    <section class="greeting-pane" id="greetingPane">
        <div class="greeting">
            <h1 class="title">BMP Picture Encrypter and Decrypter</h1>
            <button class="change-btn" id="changeBtn">Upload</button>
        </div>
    </section>

            <script src="/app.js"></script>
</body>
</html>
