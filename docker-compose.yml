services:
  c1-frontend-api:
    build: ./c1-frontend-api
    ports:
      - "7071:7071"
    environment:
      RABBITMQ_HOST: c2-rabbitmq
      RABBITMQ_USER: appuser
      RABBITMQ_PASS: apppass
    depends_on:
      - c2-rabbitmq

  c2-rabbitmq:
    build: ./c2-rabbitmq-broker
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: appuser
      RABBITMQ_DEFAULT_PASS: apppass
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  c3-consumer:
    build: ./c3-consumer
    environment:
      RABBITMQ_HOST: c2-rabbitmq
      RABBITMQ_USER: appuser
      RABBITMQ_PASS: apppass
    volumes:
      - ./c3-output:/data/output
      - ./mpi-work:/mpi-work
      - ./secrets/mpi:/ssh-secrets
    depends_on:
      - c2-rabbitmq
      - c4-worker-1
      - c4-worker-2
      - c4-worker-3

  c4-worker-1:
    build: ./c4-worker
    hostname: c4-worker-1
    volumes:
      - ./mpi-work:/mpi-work
      - ./secrets/mpi:/ssh-secrets

  c4-worker-2:
    build: ./c4-worker
    hostname: c4-worker-2
    volumes:
      - ./mpi-work:/mpi-work
      - ./secrets/mpi:/ssh-secrets

  c4-worker-3:
    build: ./c4-worker
    hostname: c4-worker-3
    volumes:
      - ./mpi-work:/mpi-work
      - ./secrets/mpi:/ssh-secrets